<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lollm · playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #12161f;
        --panel-2: #171c27;
        --line: #232a38;
        --text: #e7ecf5;
        --muted: #8b97ad;
        --accent: #63e6be;
        --accent-2: #7c9cff;
        --danger: #ff7a7a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 10% -10%, #16233a 0%, transparent 60%),
          radial-gradient(900px 500px at 110% 10%, #1b2b28 0%, transparent 55%), var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 22px rgba(99, 230, 190, 0.32);
      }
      header h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      header .badge {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 3px 8px;
        border-radius: 999px;
      }
      header .spacer {
        flex: 1;
      }
      header a {
        color: var(--muted);
        font-size: 12px;
        text-decoration: none;
      }
      header a:hover {
        color: var(--accent);
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 0;
      }
      aside {
        border-right: 1px solid var(--line);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: rgba(18, 22, 31, 0.66);
      }
      label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
      }
      select,
      textarea,
      input[type="number"] {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        font: inherit;
        font-size: 13px;
        outline: none;
      }
      select:focus,
      textarea:focus,
      input:focus {
        border-color: #3a4b6b;
      }
      textarea {
        resize: vertical;
        min-height: 84px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .stat {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px dashed var(--line);
        padding-top: 8px;
      }
      .stat b {
        color: var(--text);
        font-weight: 500;
      }
      .hint {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
      }
      section.chat {
        overflow-y: auto;
        padding: 28px clamp(16px, 5vw, 64px);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .msg {
        display: flex;
        gap: 12px;
        max-width: 860px;
        animation: rise 0.18s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      .msg .avatar {
        flex: 0 0 28px;
        height: 28px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .msg.user .avatar {
        background: #1a2740;
        color: #9db6ff;
      }
      .msg.assistant .avatar {
        background: #102a25;
        color: var(--accent);
      }
      .bubble {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.62;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .msg.user .bubble {
        background: #151c2b;
      }
      .bubble.empty::after {
        content: "▍";
        color: var(--accent);
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .tools {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .empty-state {
        margin: auto;
        text-align: center;
        color: var(--muted);
        max-width: 460px;
        line-height: 1.7;
        font-size: 13px;
      }
      .empty-state code {
        color: var(--accent);
        background: var(--panel-2);
        padding: 2px 6px;
        border-radius: 6px;
      }
      form.composer {
        border-top: 1px solid var(--line);
        padding: 14px clamp(16px, 5vw, 64px) 20px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: rgba(11, 13, 18, 0.72);
      }
      form.composer textarea {
        flex: 1;
        min-height: 48px;
        max-height: 200px;
        resize: none;
        font-size: 14px;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: 10px;
        border: 1px solid transparent;
        padding: 11px 16px;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), #4fc3f7);
        color: #06201b;
        transition: filter 0.15s ease;
      }
      button:hover {
        filter: brightness(1.06);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--muted);
        font-weight: 500;
        padding: 8px 12px;
      }
      button.ghost:hover {
        color: var(--danger);
        border-color: #4a2a2a;
      }
      .error {
        color: var(--danger);
        font-size: 13px;
        white-space: pre-wrap;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: none;
          border-bottom: 1px solid var(--line);
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        aside .hint,
        aside .stat,
        aside .settings-wide {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true"></div>
      <h1>lollm</h1>
      <span class="badge">llama.cpp · Node.js</span>
      <span class="spacer"></span>
      <a href="/api/tags" target="_blank" rel="noreferrer">models</a>
      <a href="https://github.com/xiaoajinid-bot/lollm" target="_blank" rel="noreferrer">github</a>
    </header>

    <main>
      <aside>
        <div class="settings-wide">
          <label for="model">Model</label>
          <select id="model"></select>
        </div>
        <div class="settings-wide">
          <label for="system">System prompt</label>
          <textarea id="system" placeholder="You are a helpful assistant."></textarea>
        </div>
        <div class="settings-wide">
          <label for="temperature">Temperature · <span id="tempValue">0.8</span></label>
          <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.8" />
        </div>
        <div class="row settings-wide">
          <span>Context</span>
          <span id="contextInfo">—</span>
        </div>
        <div class="stat"><span>Tokens out</span><b id="statTokens">0</b></div>
        <div class="stat"><span>Speed</span><b id="statSpeed">—</b></div>
        <div class="hint">
          Same-origin calls to the Ollama-compatible API. Try it from curl too:<br />
          <code>POST /api/chat</code>
        </div>
      </aside>

      <section class="chat" id="chat">
        <div class="empty-state" id="emptyState">
          No messages yet.<br />
          Pull a model with <code>lollm pull qwen2.5:0.5b</code>, then say hello.
        </div>
      </section>
    </main>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="Send a message…  (Enter to send, Shift+Enter for a new line)" rows="1"></textarea>
      <button type="submit" id="send">Send</button>
      <button type="button" class="ghost" id="stop" hidden>Stop</button>
    </form>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const els = {
        model: $("model"),
        system: $("system"),
        temperature: $("temperature"),
        tempValue: $("tempValue"),
        chat: $("chat"),
        empty: $("emptyState"),
        input: $("input"),
        composer: $("composer"),
        send: $("send"),
        stop: $("stop"),
        tokens: $("statTokens"),
        speed: $("statSpeed"),
        context: $("contextInfo"),
      };

      /** @type {Array<{role: string, content: string}>} */
      let history = [];
      let controller = null;
      let totalTokens = 0;

      const settings = JSON.parse(localStorage.getItem("lollm.playground") || "{}");
      if (settings.system) els.system.value = settings.system;
      if (settings.temperature) els.temperature.value = settings.temperature;
      els.tempValue.textContent = Number(els.temperature.value).toFixed(2);

      const persist = () => {
        localStorage.setItem(
          "lollm.playground",
          JSON.stringify({
            model: els.model.value,
            system: els.system.value,
            temperature: els.temperature.value,
          }),
        );
      };

      async function loadModels() {
        try {
          const response = await fetch("/api/tags");
          const data = await response.json();
          const models = data.models || [];
          els.model.innerHTML = "";
          for (const model of models) {
            const option = document.createElement("option");
            option.value = model.name;
            option.textContent = `${model.name} · ${model.details?.parameter_size || ""} ${model.details?.quantization_level || ""}`;
            els.model.appendChild(option);
          }
          if (models.length === 0) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "no models installed";
            els.model.appendChild(option);
          }
          if (settings.model) els.model.value = settings.model;
          if (!els.model.value && models[0]) els.model.value = models[0].name;
          const current = models.find((model) => model.name === els.model.value);
          els.context.textContent = current?.details?.parameter_size || "—";
        } catch (error) {
          els.context.textContent = "offline";
          console.error(error);
        }
      }

      function addMessage(role, text) {
        if (els.empty) {
          els.empty.remove();
          els.empty = null;
        }
        const wrapper = document.createElement("div");
        wrapper.className = `msg ${role}`;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "YOU" : "LLM";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrapper.append(avatar, bubble);
        els.chat.appendChild(wrapper);
        els.chat.scrollTop = els.chat.scrollHeight;
        return bubble;
      }

      function setBusy(busy) {
        els.send.disabled = busy;
        els.stop.hidden = !busy;
        els.input.disabled = busy;
      }

      function updateStats(tokens, elapsedMs) {
        totalTokens += tokens || 0;
        els.tokens.textContent = String(totalTokens);
        if (elapsedMs > 0 && tokens > 0) {
          els.speed.textContent = `${(tokens / (elapsedMs / 1000)).toFixed(1)} tok/s`;
        }
      }

      async function send() {
        const text = els.input.value.trim();
        if (!text || !els.model.value) return;
        els.input.value = "";
        els.input.style.height = "auto";
        addMessage("user", text);
        history.push({ role: "user", content: text });
        const bubble = addMessage("assistant", "");
        bubble.classList.add("empty");
        setBusy(true);
        controller = new AbortController();
        const startedAt = performance.now();
        let answer = "";
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: els.model.value,
              messages: [
                ...(els.system.value.trim() ? [{ role: "system", content: els.system.value.trim() }] : []),
                ...history,
              ],
              options: { temperature: Number(els.temperature.value) },
              stream: true,
            }),
            signal: controller.signal,
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}
            ));
            throw new Error(error.error || `HTTP ${response.status}`);
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let completionTokens = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
              if (!line.trim()) continue;
              const chunk = JSON.parse(line);
              if (chunk.message?.content) {
                answer += chunk.message.content;
                bubble.textContent = answer;
                bubble.classList.remove("empty");
                els.chat.scrollTop = els.chat.scrollHeight;
              }
              if (chunk.done) {
                completionTokens = chunk.eval_count || 0;
              }
            }
          }
          updateStats(completionTokens, performance.now() - startedAt);
          history.push({ role: "assistant", content: answer });
          persist();
        } catch (error) {
          if (error.name === "AbortError") {
            bubble.textContent = answer || "(stopped)";
            if (answer) history.push({ role: "assistant", content: answer });
          } else {
            bubble.className = "bubble error";
            bubble.textContent = String(error.message || error);
          }
        } finally {
          bubble.classList.remove("empty");
          setBusy(false);
          controller = null;
          els.input.focus();
        }
      }

      els.composer.addEventListener("submit", (event) => {
        event.preventDefault();
        void send();
      });
      els.stop.addEventListener("click", () => controller?.abort());
      els.input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          void send();
        }
      });
      els.input.addEventListener("input", () => {
        els.input.style.height = "auto";
        els.input.style.height = `${Math.min(200, els.input.scrollHeight)}px`;
      });
      els.temperature.addEventListener("input", () => {
        els.tempValue.textContent = Number(els.temperature.value).toFixed(2);
        persist();
      });
      els.model.addEventListener("change", persist);
      els.system.addEventListener("change", persist);

      await loadModels();
      els.input.focus();
    </script>
  </body>
</html>
