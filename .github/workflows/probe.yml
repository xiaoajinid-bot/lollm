name: Probe a deployment

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  checks: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Probe boot and one short completion
        continue-on-error: true
        env:
          BASE_URL: https://lollm-ai-git-${{ github.ref_name }}-xiaoajinid-bots-projects.vercel.app
        run: |
          node scripts/probe.mjs "$BASE_URL" --num-predict 16 --json > probe.json || true
          test -s probe.json || echo '{"error":"probe produced no report"}' > probe.json
          cat probe.json
      - name: Publish the probe as a check run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-report.mjs probe.json --name "lollm probe"
