name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The native llama.cpp binding is optional: the test suite runs against the
      # deterministic mock backend, so CI stays fast and never downloads weights.
      - name: Install
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Test
        id: test
        continue-on-error: true
        run: |
          status=0
          npm test > test-output.txt 2>&1 || status=$?
          cat test-output.txt
          exit $status

      # Job logs are not always reachable; publish the failing output as a check
      # run so the failure is readable from the API too.
      - name: Publish failing test output
        if: always() && steps.test.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-report.mjs test-output.txt --name "test output (Node ${{ matrix.node }})" --conclusion failure

      - name: Fail when tests failed
        if: steps.test.outcome != 'success'
        run: exit 1

  package:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: npm pack
        run: npm pack --dry-run
      - name: CLI help boots
        run: node bin/lollm.mjs --help
